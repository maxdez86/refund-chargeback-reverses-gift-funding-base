name: deploy-prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
      STAGE: ${{ vars.STAGE }}
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
      WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
      XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
      ASAAS_ENV: ${{ vars.ASAAS_ENV }}
      ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
      ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
      ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
      PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
      PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
      PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
      PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
      PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
      TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        run: |
          {
            printf 'STAGE=%q\n' "${STAGE}"
            printf 'AWS_REGION=%q\n' "${AWS_REGION}"
            printf 'ROOT_DOMAIN=%q\n' "${ROOT_DOMAIN}"
            printf 'CONTACT_EMAIL=%q\n' "${CONTACT_EMAIL}"
            printf 'API_DOMAIN=%q\n' "${API_DOMAIN}"
            printf 'WWW_DOMAIN=%q\n' "${WWW_DOMAIN}"
            printf 'CLOUDFLARE_API_TOKEN=%q\n' "${CLOUDFLARE_API_TOKEN}"
            printf 'CLOUDFLARE_ZONE_ID=%q\n' "${CLOUDFLARE_ZONE_ID}"
            printf 'OBSERVABILITY_ALERT_EMAIL=%q\n' "${OBSERVABILITY_ALERT_EMAIL}"
            printf 'XRAY_ENABLED=%q\n' "${XRAY_ENABLED}"
            printf 'ASAAS_ENV=%q\n' "${ASAAS_ENV}"
            printf 'ASAAS_API_BASE_URL=%q\n' "${ASAAS_API_BASE_URL}"
            printf 'ASAAS_API_KEY=%q\n' "${ASAAS_API_KEY}"
            printf 'ASAAS_WEBHOOK_TOKEN=%q\n' "${ASAAS_WEBHOOK_TOKEN}"
            printf 'TURNSTILE_SECRET_KEY=%q\n' "${TURNSTILE_SECRET_KEY}"
            printf 'TURNSTILE_SITE_KEY=%q\n' "${TURNSTILE_SITE_KEY}"
            printf 'PAYMENTS_TEST_GIFT_ID=%q\n' "${PAYMENTS_TEST_GIFT_ID}"
            printf 'PAYMENTS_TEST_GIFT_QUANTITY=%q\n' "${PAYMENTS_TEST_GIFT_QUANTITY}"
            printf 'PAYMENTS_TEST_PAYER_NAME=%q\n' "${PAYMENTS_TEST_PAYER_NAME}"
            printf 'PAYMENTS_TEST_PAYER_EMAIL=%q\n' "${PAYMENTS_TEST_PAYER_EMAIL}"
            printf 'PAYMENTS_TEST_PAYER_CPF=%q\n' "${PAYMENTS_TEST_PAYER_CPF}"
            printf 'PAYMENTS_TEST_PAYER_PHONE=%q\n' "${PAYMENTS_TEST_PAYER_PHONE}"
            printf 'TOFU_STATE_KEY_PREFIX=%q\n' "${TOFU_STATE_KEY_PREFIX}"
            printf 'SENTRY_AUTH_TOKEN=%q\n' "${SENTRY_AUTH_TOKEN}"
            printf 'SENTRY_ORG=%q\n' "${SENTRY_ORG}"
            printf 'SENTRY_TEAM_SLUG=%q\n' "${SENTRY_TEAM_SLUG}"
          } > .env
          test -f .env

      - name: Build landing page
        run: pnpm build:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Deploy platform stack
        run: pnpm deploy:platform

      - name: Deploy certificate stack
        run: pnpm deploy:landing:cert

      - name: Init certificate validation OpenTofu
        run: bash scripts/landing-opentofu.sh certificate-validation init

      - name: Apply certificate validation OpenTofu
        run: bash scripts/landing-opentofu.sh certificate-validation apply -auto-approve

      - name: Wait for ACM certificate issuance
        run: pnpm wait:landing:cert

      - name: Deploy landing edge stack
        run: pnpm deploy:landing:edge

      - name: Init landing DNS OpenTofu
        run: bash scripts/landing-opentofu.sh edge-dns init

      - name: Apply landing DNS OpenTofu
        run: bash scripts/landing-opentofu.sh edge-dns apply -auto-approve

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  # Post-deploy, READ-ONLY smoke test of the public surface (CloudFront site +
  # two anonymous API GETs). It runs after `deploy` succeeds and only ever issues
  # GET requests.
  #
  # SAFETY INVARIANT — DO NOT add `id-token: write` here and DO NOT add a
  # `configure-aws-credentials` step. The job intentionally has no AWS credentials
  # (job-level `permissions: contents: read` overrides the workflow-level
  # `id-token: write`), so it is structurally incapable of mutating prod. Adding
  # either would reopen the write surface this guard exists to prevent.
  smoke-prod-public:
    needs: deploy
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
    env:
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      # No build:web, no configure-aws-credentials, no OpenTofu — public HTTPS only.
      - name: Run prod public smoke
        run: pnpm smoke:prod
