name: deploy-prod

on:
  push:
    branches:
      - prod

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  detect-changes:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    outputs:
      deploy_frontend: ${{ steps.filter.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.filter.outputs.deploy_backend }}
      apply_prod_landing_dns: ${{ steps.filter.outputs.apply_prod_landing_dns }}
      apply_prod_api_dns: ${{ steps.filter.outputs.apply_prod_api_dns }}
      apply_prod_sentry: ${{ steps.filter.outputs.apply_prod_sentry }}
      apply_prod_ses_dns: ${{ steps.filter.outputs.apply_prod_ses_dns }}
      sync_asaas_webhook: ${{ steps.filter.outputs.sync_asaas_webhook }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref_name }}     # 'prod' — forces compare vs previous prod commit
          filters: |
            deploy_frontend:
              - 'apps/web/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/build-landing-bundle.sh'
              - 'scripts/deploy-landing-edge.sh'
              - 'scripts/landing-env.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/edge-stack.ts'
              - 'infra/cdk/lib/constructs/media/**'
              - 'infra/cdk/lib/constructs/website/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
            deploy_backend:
              - 'apps/api/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-backend-and-sync-asaas-webhook.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/app-stack.ts'
              - 'infra/cdk/lib/stacks/data-stack.ts'
              - 'infra/cdk/lib/stacks/observability-stack.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            apply_prod_landing_dns:
              - 'infra/opentofu/edge-dns/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/deploy-landing-edge.sh'
              - 'scripts/landing-env.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/edge-stack.ts'
              - 'infra/cdk/lib/constructs/media/**'
              - 'infra/cdk/lib/constructs/website/**'
            apply_prod_api_dns:
              - 'infra/opentofu/api-dns/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-backend-and-sync-asaas-webhook.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/app-stack.ts'
              - 'infra/cdk/lib/stacks/data-stack.ts'
              - 'infra/cdk/lib/stacks/observability-stack.ts'
            apply_prod_sentry:
              - 'infra/opentofu/sentry/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/export-sentry-config.sh'
              - 'scripts/landing-env.sh'
            apply_prod_ses_dns:
              - 'infra/opentofu/ses-dns/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/export-ses-domain-dkim-records.sh'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-backend-and-sync-asaas-webhook.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/app-stack.ts'
              - 'infra/cdk/lib/stacks/data-stack.ts'
              - 'infra/cdk/lib/stacks/observability-stack.ts'
            sync_asaas_webhook:
              - '.github/workflows/deploy-prod.yml'
              - 'scripts/asaas-webhook-sync.mjs'
              - 'scripts/lib/asaas-webhook-sync.mjs'
              - 'scripts/sync-asaas-webhook.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/landing-env.sh'
              - 'package.json'

      - name: Summarize routing
        run: |
          {
            echo "## Prod deploy routing"
            echo ""
            echo "- deploy_frontend: ${{ steps.filter.outputs.deploy_frontend }}"
            echo "- deploy_backend: ${{ steps.filter.outputs.deploy_backend }}"
            echo "- apply_prod_landing_dns: ${{ steps.filter.outputs.apply_prod_landing_dns }}"
            echo "- apply_prod_api_dns: ${{ steps.filter.outputs.apply_prod_api_dns }}"
            echo "- apply_prod_sentry: ${{ steps.filter.outputs.apply_prod_sentry }}"
            echo "- apply_prod_ses_dns: ${{ steps.filter.outputs.apply_prod_ses_dns }}"
            echo "- sync_asaas_webhook: ${{ steps.filter.outputs.sync_asaas_webhook }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    if: |
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.outputs.deploy_frontend == 'true'
    needs: detect-changes
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ADMIN_GOOGLE_HOSTED_DOMAIN: ${{ vars.ADMIN_GOOGLE_HOSTED_DOMAIN }}
          VITE_ADMIN_SESSION_MODE: ${{ vars.VITE_ADMIN_SESSION_MODE }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN WWW_DOMAIN TURNSTILE_SITE_KEY \
            GOOGLE_WEB_CLIENT_ID ADMIN_GOOGLE_HOSTED_DOMAIN VITE_ADMIN_SESSION_MODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Deploy landing edge stack
        run: pnpm deploy:landing:edge

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  apply-prod-sentry:
    if: |
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.outputs.apply_prod_sentry == 'true'
    needs: detect-changes
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-sentry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ADMIN_GOOGLE_HOSTED_DOMAIN: ${{ vars.ADMIN_GOOGLE_HOSTED_DOMAIN }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION TOFU_STATE_KEY_PREFIX SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_TEAM_SLUG

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init Sentry OpenTofu
        run: pnpm opentofu:sentry:init

      - name: Apply Sentry OpenTofu
        run: pnpm opentofu:sentry:apply -auto-approve

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  deploy-backend:
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy_backend == 'true' &&
      (needs.apply-prod-sentry.result == 'success' || needs.apply-prod-sentry.result == 'skipped')
    needs:
      - detect-changes
      - apply-prod-sentry
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          ADMIN_GOOGLE_HOSTED_DOMAIN: ${{ vars.ADMIN_GOOGLE_HOSTED_DOMAIN }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN WWW_DOMAIN \
            OBSERVABILITY_ALERT_EMAIL XRAY_ENABLED ASAAS_ENV ASAAS_API_BASE_URL \
            ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN WHATSAPP_ACCESS_TOKEN WHATSAPP_APP_SECRET \
            WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN \
            TURNSTILE_SECRET_KEY \
            GOOGLE_WEB_CLIENT_ID ADMIN_GOOGLE_HOSTED_DOMAIN \
            TOFU_STATE_KEY_PREFIX SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_TEAM_SLUG

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      # deploy:backend resolves SENTRY_DSN from the sentry module's remote state
      # (scripts/export-sentry-config.sh), which needs tofu on PATH and the module
      # initialized in this job — the apply-prod-sentry job runs on a separate runner,
      # so its .terraform does not carry over.
      - name: Init Sentry OpenTofu
        run: pnpm opentofu:sentry:init

      - name: Build landing bundle for CDK asset staging
        run: pnpm build:web

      - name: Deploy backend stacks
        run: pnpm deploy:backend

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  apply-prod-landing-dns:
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.apply_prod_landing_dns == 'true' &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    needs:
      - detect-changes
      - deploy-frontend
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-landing-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN WWW_DOMAIN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID TOFU_STATE_KEY_PREFIX

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init landing DNS OpenTofu
        run: pnpm opentofu:dns:init

      - name: Apply landing DNS OpenTofu
        run: pnpm opentofu:dns:apply -auto-approve

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  apply-prod-api-dns:
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.apply_prod_api_dns == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs:
      - detect-changes
      - deploy-backend
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-api-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN API_DOMAIN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID TOFU_STATE_KEY_PREFIX

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init API DNS OpenTofu
        run: pnpm opentofu:api-dns:init

      - name: Apply API DNS OpenTofu
        run: pnpm opentofu:api-dns:apply -auto-approve

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  sync-prod-asaas-webhook:
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.deploy_backend == 'true' ||
        needs.detect-changes.outputs.apply_prod_api_dns == 'true' ||
        needs.detect-changes.outputs.sync_asaas_webhook == 'true'
      ) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-backend.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-prod-api-dns.result)
    needs:
      - detect-changes
      - deploy-backend
      - apply-prod-api-dns
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-asaas-webhook
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN \
            ASAAS_ENV ASAAS_API_BASE_URL ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Synchronize and verify production Asaas webhook
        run: pnpm asaas:webhook:sync

      - name: Summarize Asaas webhook synchronization
        run: echo "- Production Asaas webhook synchronized and verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  apply-prod-ses-dns:
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.apply_prod_ses_dns == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    needs:
      - detect-changes
      - deploy-backend
    environment: prod
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-ses-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env full-stage prod \
            STAGE AWS_REGION ROOT_DOMAIN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID TOFU_STATE_KEY_PREFIX

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init SES DNS OpenTofu
        run: pnpm opentofu:ses-dns:init

      - name: Apply SES DNS OpenTofu
        run: pnpm opentofu:ses-dns:apply -auto-approve

      - name: Remove CI environment file
        if: always()
        run: rm -f .env

  # Post-deploy, READ-ONLY smoke test of the public surface (CloudFront site + two
  # anonymous API GETs). Runs after the deploy jobs and only ever issues GET requests.
  #
  # SAFETY INVARIANT — DO NOT add `id-token: write` here and DO NOT add a
  # `configure-aws-credentials` step. The job-level `permissions: contents: read`
  # overrides the workflow-level `id-token: write`, so this job is structurally
  # incapable of mutating prod. Adding either would reopen that write surface.
  smoke-prod-public:
    needs:
      - detect-changes
      - deploy-frontend
      - apply-prod-sentry
      - deploy-backend
      - apply-prod-landing-dns
      - apply-prod-api-dns
      - sync-prod-asaas-webhook
      - apply-prod-ses-dns
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/prod' &&
      needs.detect-changes.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-frontend.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-prod-sentry.result) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-backend.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-prod-landing-dns.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-prod-api-dns.result) &&
      contains(fromJSON('["success","skipped"]'), needs.sync-prod-asaas-webhook.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-prod-ses-dns.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    permissions:
      contents: read
    env:
      ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
      WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
      API_DOMAIN: ${{ vars.API_DOMAIN }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Run prod public smoke
        run: pnpm smoke:prod
