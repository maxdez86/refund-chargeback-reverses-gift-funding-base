name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Generate CI environment file
        shell: bash
        run: |
          {
            printf 'STAGE=%q\n' "prod"
            printf 'AWS_REGION=%q\n' "us-east-1"
            printf 'ROOT_DOMAIN=%q\n' "brimax.life"
            printf 'CONTACT_EMAIL=%q\n' "casamento@brimax.life"
            printf 'API_DOMAIN=%q\n' "api.brimax.life"
            printf 'WWW_DOMAIN=%q\n' "www.brimax.life"
            printf 'TURNSTILE_SITE_KEY=%q\n' "0x4AAAAAADWSl1ce7VLNgFRo"
          } > .env
          test -f .env

      - name: Build landing page
        run: pnpm build:web

      - name: CDK Synth
        run: pnpm synth

      - name: Remove CI environment file
        if: always()
        run: rm -f .env
