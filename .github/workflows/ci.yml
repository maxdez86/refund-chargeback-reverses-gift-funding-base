name: dev-pr-validation

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_build: ${{ steps.filter.outputs.frontend_build }}
      cdk_synth: ${{ steps.filter.outputs.cdk_synth }}
      opentofu_static: ${{ steps.filter.outputs.opentofu_static }}
      workflow_yaml: ${{ steps.filter.outputs.workflow_yaml }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend_build:
              - 'apps/web/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/build-landing-bundle.sh'
              - 'scripts/dev-web.sh'
              - 'scripts/dev-all-web-apps.sh'
              - 'infra/cdk/lib/stacks/edge-stack.ts'
              - 'infra/cdk/lib/constructs/website/**'
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.eslintrc*'
              - 'eslint.config.*'
              - 'vite.config.*'
            cdk_synth:
              - 'apps/api/**'
              - 'infra/cdk/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-platform.sh'
              - 'scripts/deploy-landing-edge.sh'
              - 'scripts/deploy-landing-certificate.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - '.eslintrc*'
              - 'eslint.config.*'
            opentofu_static:
              - 'infra/opentofu/**'
            workflow_yaml:
              - '.github/workflows/**'

      - name: Summarize routing
        run: |
          {
            echo "## PR validation routing"
            echo ""
            echo "- frontend_build: ${{ steps.filter.outputs.frontend_build }}"
            echo "- cdk_synth: ${{ steps.filter.outputs.cdk_synth }}"
            echo "- opentofu_static: ${{ steps.filter.outputs.opentofu_static }}"
            echo "- workflow_yaml: ${{ steps.filter.outputs.workflow_yaml }}"
          } >> "$GITHUB_STEP_SUMMARY"

  baseline:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Lint repo source
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/**
            apps/api/coverage/**
            packages/config/coverage/**
            infra/cdk/coverage/**
          if-no-files-found: error

  build-web:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_build == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        run: bash scripts/write-github-env-file.sh .env.dev ci-dev-minimal

      - name: Build landing page
        run: BRIMAX_ENV_FILE=.env.dev pnpm build:web

      - name: Remove CI environment file
        if: always()
        run: rm -f .env.dev

  synth-cdk:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cdk_synth == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate CI environment file
        shell: bash
        run: bash scripts/write-github-env-file.sh .env.dev ci-dev-minimal

      - name: CDK Synth
        run: BRIMAX_ENV_FILE=.env.dev pnpm synth

      - name: Remove CI environment file
        if: always()
        run: rm -f .env.dev

  validate-opentofu:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.opentofu_static == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/opentofu

  validate-workflows:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.workflow_yaml == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

      - name: Validate stage env writer mappings
        shell: bash
        run: |
          ruby -e '
            require "yaml"

            variable_keys = %w[
              STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN WWW_DOMAIN
              CLOUDFLARE_ZONE_ID OBSERVABILITY_ALERT_EMAIL XRAY_ENABLED ASAAS_ENV
              ASAAS_API_BASE_URL TURNSTILE_SITE_KEY PAYMENTS_TEST_GIFT_ID
              PAYMENTS_TEST_GIFT_QUANTITY TOFU_STATE_KEY_PREFIX SENTRY_ORG
              SENTRY_TEAM_SLUG
            ]
            secret_keys = %w[
              CLOUDFLARE_API_TOKEN ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN
              TURNSTILE_SECRET_KEY PAYMENTS_TEST_PAYER_NAME
              PAYMENTS_TEST_PAYER_EMAIL PAYMENTS_TEST_PAYER_CPF
              PAYMENTS_TEST_PAYER_PHONE SENTRY_AUTH_TOKEN
            ]

            expected = {}
            variable_keys.each do |key|
              expected[key] = "$" + "{{ vars.#{key} }}"
            end
            secret_keys.each do |key|
              expected[key] = "$" + "{{ secrets.#{key} }}"
            end

            writer_count = 0
            %w[
              .github/workflows/deploy-dev.yml
              .github/workflows/deploy-prod.yml
            ].each do |file|
              workflow = YAML.load_file(file)
              workflow.fetch("jobs").each do |job_name, job|
                Array(job["steps"]).each do |step|
                  next unless step["run"].to_s.include?("write-github-env-file.sh")
                  next unless step["run"].to_s.include?("full-stage")

                  writer_count += 1
                  step_env = step["env"] || {}
                  mismatches = expected.filter_map do |key, value|
                    key unless step_env[key] == value
                  end
                  next if mismatches.empty?

                  abort "#{file} job #{job_name} stage env writer has missing or incorrect mappings: #{mismatches.join(", ")}"
                end
              end
            end

            abort "Expected 11 full-stage env writers, found #{writer_count}" unless writer_count == 11
            puts "validated #{writer_count} full-stage env writer mappings"
          '
