name: deploy-dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_frontend: ${{ steps.filter.outputs.deploy_frontend }}
      deploy_backend: ${{ steps.filter.outputs.deploy_backend }}
      apply_dev_landing_dns: ${{ steps.filter.outputs.apply_dev_landing_dns }}
      apply_dev_api_dns: ${{ steps.filter.outputs.apply_dev_api_dns }}
      apply_dev_sentry: ${{ steps.filter.outputs.apply_dev_sentry }}
      sync_asaas_webhook: ${{ steps.filter.outputs.sync_asaas_webhook }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deploy_frontend:
              - 'apps/web/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/build-landing-bundle.sh'
              - 'scripts/deploy-landing-edge.sh'
              - 'scripts/landing-env.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/edge-stack.ts'
              - 'infra/cdk/lib/constructs/media/**'
              - 'infra/cdk/lib/constructs/website/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
            deploy_backend:
              - 'apps/api/**'
              - 'packages/config/**'
              - 'packages/contracts/**'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-backend-and-sync-asaas-webhook.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/app-stack.ts'
              - 'infra/cdk/lib/stacks/data-stack.ts'
              - 'infra/cdk/lib/stacks/observability-stack.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            apply_dev_landing_dns:
              - 'infra/opentofu/edge-dns/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/deploy-landing-edge.sh'
              - 'scripts/landing-env.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/edge-stack.ts'
              - 'infra/cdk/lib/constructs/media/**'
              - 'infra/cdk/lib/constructs/website/**'
            apply_dev_api_dns:
              - 'infra/opentofu/api-dns/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/deploy-backend.sh'
              - 'scripts/deploy-backend-and-sync-asaas-webhook.sh'
              - 'scripts/landing-env.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/export-sentry-config.sh'
              - 'infra/cdk/bin/app.ts'
              - 'infra/cdk/lib/stacks/app-stack.ts'
              - 'infra/cdk/lib/stacks/data-stack.ts'
              - 'infra/cdk/lib/stacks/observability-stack.ts'
            apply_dev_sentry:
              - 'infra/opentofu/sentry/**'
              - 'scripts/landing-opentofu.sh'
              - 'scripts/export-sentry-config.sh'
              - 'scripts/landing-env.sh'
            sync_asaas_webhook:
              - '.github/workflows/deploy-dev.yml'
              - 'scripts/asaas-webhook-sync.mjs'
              - 'scripts/lib/asaas-webhook-sync.mjs'
              - 'scripts/sync-asaas-webhook.sh'
              - 'scripts/payments-env.sh'
              - 'scripts/landing-env.sh'
              - 'package.json'

      - name: Summarize routing
        run: |
          {
            echo "## Dev deploy routing"
            echo ""
            echo "- deploy_frontend: ${{ steps.filter.outputs.deploy_frontend }}"
            echo "- deploy_backend: ${{ steps.filter.outputs.deploy_backend }}"
            echo "- apply_dev_landing_dns: ${{ steps.filter.outputs.apply_dev_landing_dns }}"
            echo "- apply_dev_api_dns: ${{ steps.filter.outputs.apply_dev_api_dns }}"
            echo "- apply_dev_sentry: ${{ steps.filter.outputs.apply_dev_sentry }}"
            echo "- sync_asaas_webhook: ${{ steps.filter.outputs.sync_asaas_webhook }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_frontend == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN WWW_DOMAIN TURNSTILE_SITE_KEY

      - name: Deploy landing edge stack
        run: BRIMAX_ENV_FILE=.env.dev pnpm deploy:landing:edge

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev

  apply-dev-sentry:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.apply_dev_sentry == 'true'
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION TOFU_STATE_KEY_PREFIX SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_TEAM_SLUG

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init dev Sentry infrastructure
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:sentry:init

      - name: Apply dev Sentry infrastructure
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:sentry:apply -auto-approve

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev

  deploy-backend:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - apply-dev-sentry
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.deploy_backend == 'true' &&
      (needs.apply-dev-sentry.result == 'success' || needs.apply-dev-sentry.result == 'skipped')
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN WWW_DOMAIN \
            OBSERVABILITY_ALERT_EMAIL XRAY_ENABLED ASAAS_ENV ASAAS_API_BASE_URL \
            ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN TOFU_STATE_KEY_PREFIX \
            SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_TEAM_SLUG

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      # deploy:backend resolves SENTRY_DSN from the sentry module's remote state
      # (scripts/export-sentry-config.sh), which needs tofu on PATH and the module
      # initialized in this job — the apply-dev-sentry job runs on a separate runner,
      # so its .terraform does not carry over.
      - name: Init dev Sentry infrastructure
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:sentry:init

      # The CDK app always instantiates EdgeStack, so backend-only deploys still
      # need the static site bundle on disk for S3 asset staging.
      - name: Build landing bundle for CDK asset staging
        run: BRIMAX_ENV_FILE=.env.dev pnpm build:web

      - name: Deploy backend stacks
        run: BRIMAX_ENV_FILE=.env.dev pnpm deploy:backend

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev

  apply-dev-landing-dns:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-frontend
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.apply_dev_landing_dns == 'true' &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION ROOT_DOMAIN WWW_DOMAIN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID TOFU_STATE_KEY_PREFIX

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init dev landing DNS
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:dns:init

      - name: Apply dev landing DNS
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:dns:apply -auto-approve

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev

  apply-dev-api-dns:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-backend
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.apply_dev_api_dns == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          OBSERVABILITY_ALERT_EMAIL: ${{ vars.OBSERVABILITY_ALERT_EMAIL }}
          XRAY_ENABLED: ${{ vars.XRAY_ENABLED }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PAYMENTS_TEST_GIFT_ID: ${{ vars.PAYMENTS_TEST_GIFT_ID }}
          PAYMENTS_TEST_GIFT_QUANTITY: ${{ vars.PAYMENTS_TEST_GIFT_QUANTITY }}
          PAYMENTS_TEST_PAYER_NAME: ${{ secrets.PAYMENTS_TEST_PAYER_NAME }}
          PAYMENTS_TEST_PAYER_EMAIL: ${{ secrets.PAYMENTS_TEST_PAYER_EMAIL }}
          PAYMENTS_TEST_PAYER_CPF: ${{ secrets.PAYMENTS_TEST_PAYER_CPF }}
          PAYMENTS_TEST_PAYER_PHONE: ${{ secrets.PAYMENTS_TEST_PAYER_PHONE }}
          TOFU_STATE_KEY_PREFIX: ${{ vars.TOFU_STATE_KEY_PREFIX }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_TEAM_SLUG: ${{ vars.SENTRY_TEAM_SLUG }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION ROOT_DOMAIN API_DOMAIN CLOUDFLARE_API_TOKEN CLOUDFLARE_ZONE_ID TOFU_STATE_KEY_PREFIX

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.6

      - name: Init dev API DNS
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:api-dns:init

      - name: Apply dev API DNS
        run: BRIMAX_ENV_FILE=.env.dev pnpm opentofu:api-dns:apply -auto-approve

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev

  sync-dev-asaas-webhook:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-backend
      - apply-dev-api-dns
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (
        needs.detect-changes.outputs.deploy_backend == 'true' ||
        needs.detect-changes.outputs.apply_dev_api_dns == 'true' ||
        needs.detect-changes.outputs.sync_asaas_webhook == 'true'
      ) &&
      contains(fromJSON('["success","skipped"]'), needs.deploy-backend.result) &&
      contains(fromJSON('["success","skipped"]'), needs.apply-dev-api-dns.result)
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate dev environment file
        shell: bash
        env:
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          ASAAS_ENV: ${{ vars.ASAAS_ENV }}
          ASAAS_API_BASE_URL: ${{ vars.ASAAS_API_BASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
        run: |
          bash scripts/write-github-env-file.sh .env.dev full-stage dev \
            STAGE AWS_REGION ROOT_DOMAIN CONTACT_EMAIL API_DOMAIN \
            ASAAS_ENV ASAAS_API_BASE_URL ASAAS_API_KEY ASAAS_WEBHOOK_TOKEN

      - name: Synchronize and verify dev Asaas webhook
        run: BRIMAX_ENV_FILE=.env.dev pnpm asaas:webhook:sync

      - name: Summarize Asaas webhook synchronization
        run: echo "- Dev Asaas webhook synchronized and verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove dev environment file
        if: always()
        run: rm -f .env.dev
