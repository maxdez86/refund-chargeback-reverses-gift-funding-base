name: Publish image to ECR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod
  push:
    branches:
      - dev
      - stage
      - prod

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SLACK_NOTIFICATIONS_ENABLED: "true"

permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name) }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch != 'prod') || (github.event_name != 'workflow_dispatch' && github.ref_name != 'prod') }}

jobs:
  prepare:
    name: Prepare publish context
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.context.outputs.deploy_branch }}
      workflow_ref: ${{ steps.context.outputs.workflow_ref }}
      is_cross_branch_deploy: ${{ steps.context.outputs.is_cross_branch_deploy }}
      trigger_event: ${{ steps.context.outputs.trigger_event }}
      trigger_actor: ${{ steps.context.outputs.trigger_actor }}
      module: ${{ steps.context.outputs.module }}
      package_version: ${{ steps.prod-metadata.outputs.package_version }}
      source_sha: ${{ steps.prod-metadata.outputs.source_sha }}
      deploy_mode: ${{ steps.prod-metadata.outputs.deploy_mode }}
      prod_target_tag: ${{ steps.prod-metadata.outputs.prod_target_tag }}
      stage_source_tag: ${{ steps.prod-metadata.outputs.stage_source_tag }}
      stage_source_sha: ${{ steps.prod-metadata.outputs.stage_source_sha }}
      stage_source_version: ${{ steps.prod-metadata.outputs.stage_source_version }}

    steps:
      - name: Resolve target branch and workflow ref
        id: context
        env:
          DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${DEPLOY_BRANCH}" = "prod" ] && [ "${WORKFLOW_REF}" != "prod" ]; then
            echo "::error::Manual Prod publish must be run with 'Use workflow from' set to prod."
            exit 1
          fi

          if [ "${WORKFLOW_REF}" != "${DEPLOY_BRANCH}" ]; then
            IS_CROSS_BRANCH_DEPLOY="yes"
          else
            IS_CROSS_BRANCH_DEPLOY="no"
          fi

          echo "deploy_branch=${DEPLOY_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "workflow_ref=${WORKFLOW_REF}" >> "$GITHUB_OUTPUT"
          echo "is_cross_branch_deploy=${IS_CROSS_BRANCH_DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "trigger_event=${GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "trigger_actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"
          echo "module=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          echo "Target environment branch: ${DEPLOY_BRANCH}"
          echo "Selected workflow ref: ${WORKFLOW_REF}"
          echo "Trigger event: ${GITHUB_EVENT_NAME}"
          echo "Cross-branch deploy: ${IS_CROSS_BRANCH_DEPLOY}"

      - name: Checkout workflow ref
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.context.outputs.workflow_ref }}
          fetch-depth: 2

      - name: Get module version
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package version=${VERSION}"

      - name: Derive prod deployment metadata
        id: prod-metadata
        env:
          DEPLOY_BRANCH: ${{ steps.context.outputs.deploy_branch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SOURCE_SHA=$(git rev-parse HEAD)
          EFFECTIVE_PACKAGE_VERSION="${PACKAGE_VERSION}"
          DEPLOY_MODE="not_prod"
          PROD_TARGET_TAG=""
          STAGE_SOURCE_TAG=""
          STAGE_SOURCE_SHA=""
          STAGE_SOURCE_VERSION=""
          DETECTION_SOURCE="not_prod"

          if [ "${DEPLOY_BRANCH}" = "prod" ]; then
            COMMIT_SUBJECT=$(git log -1 --pretty=%s)
            COMMIT_BODY=$(git log -1 --pretty=%b)
            PROD_TARGET_TAG="prod_${EFFECTIVE_PACKAGE_VERSION}"
            DETECTION_SOURCE="hotfix_default"

            PR_API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${REPOSITORY}/commits/${SOURCE_SHA}/pulls"
            PR_RESPONSE_FILE=$(mktemp)
            PR_HTTP_CODE=$(curl -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "${PR_RESPONSE_FILE}" \
              -w "%{http_code}" \
              "${PR_API_URL}" || true)

            if [ "${PR_HTTP_CODE}" = "200" ]; then
              MATCHING_PR=$(jq -c --arg source_sha "${SOURCE_SHA}" '
                map(select(.merge_commit_sha == $source_sha))
                | map(select(.base.ref == "prod" and .head.ref == "stage"))
                | first // empty
              ' "${PR_RESPONSE_FILE}")

              if [ -n "${MATCHING_PR}" ]; then
                DEPLOY_MODE="stage_promotion"
                DETECTION_SOURCE="pr_metadata"
                echo "Matched merged PR for commit ${SOURCE_SHA}: $(printf '%s\n' "${MATCHING_PR}" | jq -r '.html_url // .number // "unknown"')"
              else
                echo "No matching merged stage->prod PR metadata found for commit ${SOURCE_SHA}; falling back to git topology."
              fi
            else
              echo "Unable to query PR metadata for commit ${SOURCE_SHA} (HTTP ${PR_HTTP_CODE:-curl_error}); falling back to git topology."
              if [ -s "${PR_RESPONSE_FILE}" ]; then
                echo "GitHub API response:"
                cat "${PR_RESPONSE_FILE}"
              fi
            fi

            rm -f "${PR_RESPONSE_FILE}"

            if [ "${DEPLOY_MODE}" != "stage_promotion" ]; then
              PARENTS=$(git show -s --format=%P HEAD)
              PARENT_COUNT=$(printf '%s\n' "${PARENTS}" | awk '{print NF}')

              if [ "${PARENT_COUNT}" -eq 2 ]; then
                git fetch --no-tags --depth=1 origin stage
                STAGE_HEAD_SHA=$(git rev-parse FETCH_HEAD)
                SECOND_PARENT_SHA=$(printf '%s\n' "${PARENTS}" | awk '{print $2}')

                if [ "${SECOND_PARENT_SHA}" = "${STAGE_HEAD_SHA}" ]; then
                  DEPLOY_MODE="stage_promotion"
                  DETECTION_SOURCE="git_topology"
                  echo "Detected stage promotion from git topology: second parent ${SECOND_PARENT_SHA} matches origin/stage ${STAGE_HEAD_SHA}."
                else
                  echo "Git topology fallback did not match stage promotion: second parent ${SECOND_PARENT_SHA}, origin/stage ${STAGE_HEAD_SHA}."
                fi
              else
                echo "Git topology fallback skipped: commit ${SOURCE_SHA} has ${PARENT_COUNT} parent(s)."
              fi
            fi

            if [ "${DEPLOY_MODE}" != "stage_promotion" ]; then
              DEPLOY_MODE="hotfix_build"
              DETECTION_SOURCE="hotfix_default"
            fi

            if [ "${DEPLOY_MODE}" = "stage_promotion" ]; then
              PARENTS=$(git show -s --format=%P HEAD)
              PARENT_COUNT=$(printf '%s\n' "${PARENTS}" | awk '{print NF}')

              if [ "${PARENT_COUNT}" -ne 2 ]; then
                echo "::error::Prod stage promotion commits must be two-parent merges. Found ${PARENT_COUNT} parent(s) for ${SOURCE_SHA}."
                exit 1
              fi

              STAGE_SOURCE_SHA=$(printf '%s\n' "${PARENTS}" | awk '{print $2}')
              STAGE_SOURCE_VERSION=$(git show "${STAGE_SOURCE_SHA}:pyproject.toml" | grep -m1 '^version =' | sed 's/version = "\(.*\)"/\1/' || true)

              if [ -z "${STAGE_SOURCE_VERSION}" ]; then
                echo "::error::Unable to determine Stage source version from ${STAGE_SOURCE_SHA}:pyproject.toml."
                exit 1
              fi

              EFFECTIVE_PACKAGE_VERSION="${STAGE_SOURCE_VERSION}"
              STAGE_SOURCE_TAG="stage_${STAGE_SOURCE_VERSION}"
              PROD_TARGET_TAG="prod_${STAGE_SOURCE_VERSION}"
            fi

            echo "Prod commit subject: ${COMMIT_SUBJECT}"
            if [ -n "${COMMIT_BODY}" ]; then
              echo "Prod commit body:"
              printf '%s\n' "${COMMIT_BODY}"
            else
              echo "Prod commit body: <empty>"
            fi
            echo "Prod deploy detection source: ${DETECTION_SOURCE}"
            echo "Resolved prod deploy mode: ${DEPLOY_MODE}"
            if [ "${DEPLOY_MODE}" = "stage_promotion" ]; then
              echo "Stage source SHA: ${STAGE_SOURCE_SHA}"
              echo "Stage source version: ${STAGE_SOURCE_VERSION}"
              echo "Resolved Stage source tag: ${STAGE_SOURCE_TAG}"
              echo "Resolved Prod target tag: ${PROD_TARGET_TAG}"
            fi
          fi

          echo "package_version=${EFFECTIVE_PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${DEPLOY_MODE}" >> "$GITHUB_OUTPUT"
          echo "prod_target_tag=${PROD_TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "stage_source_tag=${STAGE_SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "stage_source_sha=${STAGE_SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "stage_source_version=${STAGE_SOURCE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved source SHA: ${SOURCE_SHA}"
          echo "Resolved package version: ${EFFECTIVE_PACKAGE_VERSION}"

  preview-prod:
    name: Preview Prod approval context
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_branch == 'prod'
    environment: prod
    outputs:
      source_sha: ${{ steps.publish-preview.outputs.source_sha }}
      deploy_mode: ${{ steps.publish-preview.outputs.deploy_mode }}
      package_version: ${{ steps.publish-preview.outputs.package_version }}
      prod_target_tag: ${{ steps.publish-preview.outputs.prod_target_tag }}
      stage_source_tag: ${{ steps.publish-preview.outputs.stage_source_tag }}
      stage_source_sha: ${{ steps.publish-preview.outputs.stage_source_sha }}
      stage_source_version: ${{ steps.publish-preview.outputs.stage_source_version }}
      current_prod_version: ${{ steps.publish-preview.outputs.current_prod_version }}
      current_prod_tags: ${{ steps.publish-preview.outputs.current_prod_tags }}
      current_prod_digest: ${{ steps.publish-preview.outputs.current_prod_digest }}
      stage_source_digest: ${{ steps.publish-preview.outputs.stage_source_digest }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.deploy_branch }}
          fetch-depth: 1

      - name: Validate Prod preview AWS configuration
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
          AWS_ACCOUNT_ID_STAGE: ${{ secrets.AWS_ACCOUNT_ID_STAGE }}
          AWS_ROLE_NAME_STAGE: ${{ vars.AWS_ROLE_NAME_STAGE }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.deploy_mode }}
        run: |
          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "Missing prod AWS account configuration. Expected secrets.AWS_ACCOUNT_ID."
            exit 1
          fi

          if [ -z "${AWS_ROLE_NAME}" ]; then
            echo "Missing prod AWS role configuration. Expected vars.AWS_ROLE_NAME."
            exit 1
          fi

          if [ "${DEPLOY_MODE}" = "stage_promotion" ] && [ -z "${AWS_ACCOUNT_ID_STAGE}" ]; then
            echo "Missing prod environment secret AWS_ACCOUNT_ID_STAGE for stage-to-prod preview."
            exit 1
          fi

          if [ "${DEPLOY_MODE}" = "stage_promotion" ] && [ -z "${AWS_ROLE_NAME_STAGE}" ]; then
            echo "Missing prod environment variable AWS_ROLE_NAME_STAGE for stage-to-prod preview."
            exit 1
          fi

      - name: Configure AWS Credentials for Stage preview
        if: needs.prepare.outputs.deploy_mode == 'stage_promotion'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGE }}:role/${{ vars.AWS_ROLE_NAME_STAGE }}
          role-session-name: preview_module_${{ needs.prepare.outputs.module }}_${{ secrets.AWS_ACCOUNT_ID_STAGE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Stage source image metadata
        id: stage-preview
        if: needs.prepare.outputs.deploy_mode == 'stage_promotion'
        env:
          STAGE_SOURCE_TAG: ${{ needs.prepare.outputs.stage_source_tag }}
        run: |
          if ! STAGE_SOURCE_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ needs.prepare.outputs.module }}" \
            --image-ids imageTag="${STAGE_SOURCE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text); then
            echo "::error::Unable to read Stage image metadata for ${STAGE_SOURCE_TAG}. This tag was resolved from the Stage merge parent, not the merged Prod tree."
            exit 1
          fi

          if [ -z "${STAGE_SOURCE_DIGEST}" ] || [ "${STAGE_SOURCE_DIGEST}" = "None" ]; then
            echo "::error::Unable to read Stage image metadata for ${STAGE_SOURCE_TAG}. This tag was resolved from the Stage merge parent, not the merged Prod tree."
            exit 1
          fi

          echo "stage_source_digest=${STAGE_SOURCE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials for Prod preview
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          role-session-name: preview_module_${{ needs.prepare.outputs.module }}_${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish approval preview
        id: publish-preview
        env:
          TRIGGER_EVENT: ${{ needs.prepare.outputs.trigger_event }}
          TRIGGER_ACTOR: ${{ needs.prepare.outputs.trigger_actor }}
          DEPLOY_BRANCH: ${{ needs.prepare.outputs.deploy_branch }}
          WORKFLOW_REF: ${{ needs.prepare.outputs.workflow_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IS_CROSS_BRANCH_DEPLOY: ${{ needs.prepare.outputs.is_cross_branch_deploy }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.deploy_mode }}
          PROD_TARGET_TAG: ${{ needs.prepare.outputs.prod_target_tag }}
          STAGE_SOURCE_TAG: ${{ needs.prepare.outputs.stage_source_tag }}
          STAGE_SOURCE_SHA: ${{ needs.prepare.outputs.stage_source_sha }}
          STAGE_SOURCE_VERSION: ${{ needs.prepare.outputs.stage_source_version }}
          STAGE_SOURCE_DIGEST: ${{ steps.stage-preview.outputs.stage_source_digest }}
          WORKFLOW_PURPOSE: Publish image to ECR
        run: |
          CURRENT_PROD_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ needs.prepare.outputs.module }}" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          CURRENT_PROD_TAGS=$(aws ecr describe-images \
            --repository-name "${{ needs.prepare.outputs.module }}" \
            --image-ids imageTag=latest \
            --query 'imageDetails[0].imageTags' \
            --output text 2>/dev/null || true)

          if [ -z "${CURRENT_PROD_DIGEST}" ] || [ "${CURRENT_PROD_DIGEST}" = "None" ]; then
            CURRENT_PROD_DIGEST="unknown"
          fi

          if [ -z "${CURRENT_PROD_TAGS}" ] || [ "${CURRENT_PROD_TAGS}" = "None" ]; then
            CURRENT_PROD_TAGS="latest tag not found"
            CURRENT_PROD_VERSION="INITIAL_STATE"
          else
            CURRENT_PROD_TAGS=$(printf '%s\n' "${CURRENT_PROD_TAGS}" | xargs)
            CURRENT_PROD_VERSION=$(printf '%s\n' "${CURRENT_PROD_TAGS}" | tr '\t' '\n' | grep '^prod_' | head -n1 || true)

            if [ -z "${CURRENT_PROD_VERSION}" ]; then
              CURRENT_PROD_VERSION="unknown"
            fi
          fi

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${DEPLOY_MODE}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prod_target_tag=${PROD_TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "stage_source_tag=${STAGE_SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "stage_source_sha=${STAGE_SOURCE_SHA:-}" >> "$GITHUB_OUTPUT"
          echo "stage_source_version=${STAGE_SOURCE_VERSION:-}" >> "$GITHUB_OUTPUT"
          echo "current_prod_version=${CURRENT_PROD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_prod_tags=${CURRENT_PROD_TAGS}" >> "$GITHUB_OUTPUT"
          echo "current_prod_digest=${CURRENT_PROD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "stage_source_digest=${STAGE_SOURCE_DIGEST:-}" >> "$GITHUB_OUTPUT"

          if [ "${DEPLOY_MODE}" = "stage_promotion" ]; then
            MODE_LABEL="Stage promotion"
            APPROVAL_SENTENCE="Approving this workflow will deploy the Stage promotion from ${STAGE_SOURCE_TAG} to ${PROD_TARGET_TAG} in Prod."
            SUMMARY_DETAILS=(
              "- Current live Prod version: ${CURRENT_PROD_VERSION}"
              "- Current live Prod tags: ${CURRENT_PROD_TAGS}"
              "- Current live Prod digest: ${CURRENT_PROD_DIGEST}"
              "- Target Prod version: ${PROD_TARGET_TAG}"
              "- Source Stage image tag: ${STAGE_SOURCE_TAG}"
              "- Source image type: Stage promotion"
              "- Target Prod image tag: ${PROD_TARGET_TAG}"
            )

            if [ -n "${STAGE_SOURCE_VERSION:-}" ]; then
              SUMMARY_DETAILS+=("- Source Stage version: ${STAGE_SOURCE_VERSION}")
            fi

            if [ -n "${STAGE_SOURCE_SHA:-}" ]; then
              SUMMARY_DETAILS+=("- Source Stage commit SHA: ${STAGE_SOURCE_SHA}")
            fi

            if [ -n "${STAGE_SOURCE_DIGEST:-}" ]; then
              SUMMARY_DETAILS+=("- Source Stage image digest: ${STAGE_SOURCE_DIGEST}")
            fi

            PLAN_STEPS=(
              "1. Promote the previewed Stage image ${STAGE_SOURCE_TAG} to ${PROD_TARGET_TAG}."
              "2. Refresh the Prod \`latest\` tag to point to the promoted image."
            )
          elif [ "${DEPLOY_MODE}" = "hotfix_build" ]; then
            MODE_LABEL="Prod hotfix rebuild"
            APPROVAL_SENTENCE="Approving this workflow will deploy the Prod hotfix rebuild from ${DEPLOY_BRANCH}@${SOURCE_SHA} as ${PROD_TARGET_TAG}."
            SUMMARY_DETAILS=(
              "- Current live Prod version: ${CURRENT_PROD_VERSION}"
              "- Current live Prod tags: ${CURRENT_PROD_TAGS}"
              "- Current live Prod digest: ${CURRENT_PROD_DIGEST}"
              "- Target Prod version: ${PROD_TARGET_TAG}"
              "- Source image type: Prod hotfix rebuild"
              "- Source build ref: ${DEPLOY_BRANCH}@${SOURCE_SHA}"
              "- Target Prod image tag: ${PROD_TARGET_TAG}"
            )
            PLAN_STEPS=(
              "1. Build a new image from the previewed commit ${DEPLOY_BRANCH}@${SOURCE_SHA}."
              "2. Publish ${PROD_TARGET_TAG} and refresh the Prod \`latest\` tag."
            )
          else
            echo "::error::Unsupported DEPLOY_MODE ${DEPLOY_MODE} for Prod preview."
            exit 1
          fi

          {
            echo "## Prod Publish Approval Preview"
            echo
            echo "- Environment: prod"
            echo "- Workflow purpose: Publish image to ECR"
            echo "- Trigger: ${TRIGGER_EVENT}"
            echo "- Triggered by: ${TRIGGER_ACTOR}"
            echo "- Target environment branch: ${DEPLOY_BRANCH}"
            echo "- Selected workflow ref: ${WORKFLOW_REF}"
            echo "- Source commit SHA: ${SOURCE_SHA}"
            echo "- Cross-branch deploy: ${IS_CROSS_BRANCH_DEPLOY}"
            echo "- Package version: ${PACKAGE_VERSION}"
            echo "- Deploy mode: ${MODE_LABEL}"
            echo "- Preview type: Pre-approval live ECR preview"
            for line in "${SUMMARY_DETAILS[@]}"; do
              echo "${line}"
            done
            echo "- Approval statement: ${APPROVAL_SENTENCE}"
            echo "- Preview note: This preview was generated from the pinned source ref and live ECR metadata before the single Prod approval."
            echo "### Deployment Plan"
            echo
            for line in "${PLAN_STEPS[@]}"; do
              echo "${line}"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Slack Notification - Failure
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && failure()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "<!channel> :x: Prod publish preview failed for ${{ needs.prepare.outputs.module }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!channel> :x: *Prod publish preview failed*\n\n*Repository:* ${{ github.repository }}\n*Environment:* prod\n*Module:* ${{ needs.prepare.outputs.module }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check workflow logs>"

  approval-prod-image-publish:
    name: Wait for Prod publish approval
    runs-on: ubuntu-latest
    needs:
      - prepare
      - preview-prod
    if: needs.prepare.outputs.deploy_branch == 'prod'
    environment:
      name: approval-prod-image-publish

    steps:
      - name: Await manual approval
        run: echo "Review the preview-prod job summary before approving this Prod image publish."

  publish-dev:
    name: Publish image to Dev ECR
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_branch == 'dev'
    environment: dev

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.workflow_ref }}
          fetch-depth: 2

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          docker system prune -af
          docker volume prune -f

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "After cleanup:"
          df -h

      - name: Validate Dev AWS configuration
        id: dev-aws-config
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
        run: |
          echo "aws_account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "aws_role_name=${AWS_ROLE_NAME}" >> "$GITHUB_OUTPUT"

          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "Missing dev AWS account configuration. Expected secrets.AWS_ACCOUNT_ID."
            exit 1
          fi

          if [ -z "${AWS_ROLE_NAME}" ]; then
            echo "Missing dev AWS role configuration. Expected vars.AWS_ROLE_NAME."
            exit 1
          fi

      - name: Configure AWS Credentials for Dev
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.dev-aws-config.outputs.aws_account_id }}:role/${{ steps.dev-aws-config.outputs.aws_role_name }}
          role-session-name: publish_module_${{ needs.prepare.outputs.module }}_${{ steps.dev-aws-config.outputs.aws_account_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Dev ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Docker meta for Dev
        id: meta-dev
        uses: docker/metadata-action@v6.0.0
        env:
          TARGET_ECR_REGISTRY: ${{ steps.dev-aws-config.outputs.aws_account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        with:
          images: ${{ env.TARGET_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}
          flavor: |
            latest=true
            suffix=_${{ env.PACKAGE_VERSION }},onlatest=false
          tags: |
            type=raw,value=dev

      - name: Build and push image to Dev
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}

      - name: Dev publish summary
        if: always()
        env:
          DEPLOY_BRANCH: ${{ needs.prepare.outputs.deploy_branch }}
          WORKFLOW_REF: ${{ needs.prepare.outputs.workflow_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IS_CROSS_BRANCH_DEPLOY: ${{ needs.prepare.outputs.is_cross_branch_deploy }}
        run: |
          {
            echo "## Dev Publish Summary"
            echo
            echo "- Environment: dev"
            echo "- Target environment branch: ${DEPLOY_BRANCH}"
            echo "- Selected workflow ref: ${WORKFLOW_REF}"
            echo "- Source commit SHA: ${SOURCE_SHA}"
            echo "- Cross-branch deploy: ${IS_CROSS_BRANCH_DEPLOY}"
            echo "- Version: ${{ needs.prepare.outputs.package_version }}"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack Notification - Success
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && success()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":white_check_mark: Image publish succeeded for ${{ needs.prepare.outputs.module }} in dev"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":white_check_mark: *Image publish succeeded*\n\n*Repository:* ${{ github.repository }}\n*Environment:* dev\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.prepare.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.prepare.outputs.package_version }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"

      - name: Slack Notification - Failure
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && failure()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "<!channel> :x: Image publish failed for ${{ needs.prepare.outputs.module }} in dev"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!channel> :x: *Image publish failed*\n\n*Repository:* ${{ github.repository }}\n*Environment:* dev\n*Module:* ${{ needs.prepare.outputs.module }}\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.prepare.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.prepare.outputs.package_version }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check workflow logs>"

  publish-stage:
    name: Publish image to Stage ECR
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.deploy_branch == 'stage'
    environment: stage

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.workflow_ref }}

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          docker system prune -af
          docker volume prune -f

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "After cleanup:"
          df -h

      - name: Validate Stage AWS configuration
        id: stage-aws-config
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
        run: |
          echo "aws_account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "aws_role_name=${AWS_ROLE_NAME}" >> "$GITHUB_OUTPUT"

          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "Missing stage AWS account configuration. Expected secrets.AWS_ACCOUNT_ID."
            exit 1
          fi

          if [ -z "${AWS_ROLE_NAME}" ]; then
            echo "Missing stage AWS role configuration. Expected vars.AWS_ROLE_NAME."
            exit 1
          fi

      - name: Configure AWS Credentials for Stage
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.stage-aws-config.outputs.aws_account_id }}:role/${{ steps.stage-aws-config.outputs.aws_role_name }}
          role-session-name: publish_module_${{ needs.prepare.outputs.module }}_${{ steps.stage-aws-config.outputs.aws_account_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Stage ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Docker meta for Stage
        id: meta-stage
        uses: docker/metadata-action@v6.0.0
        env:
          TARGET_ECR_REGISTRY: ${{ steps.stage-aws-config.outputs.aws_account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
        with:
          images: ${{ env.TARGET_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}
          flavor: |
            latest=true
            suffix=_${{ env.PACKAGE_VERSION }},onlatest=false
          tags: |
            type=raw,value=stage

      - name: Build and push image to Stage
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta-stage.outputs.tags }}
          labels: ${{ steps.meta-stage.outputs.labels }}

      - name: Stage publish summary
        if: always()
        env:
          DEPLOY_BRANCH: ${{ needs.prepare.outputs.deploy_branch }}
          WORKFLOW_REF: ${{ needs.prepare.outputs.workflow_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          IS_CROSS_BRANCH_DEPLOY: ${{ needs.prepare.outputs.is_cross_branch_deploy }}
        run: |
          {
            echo "## Stage Publish Summary"
            echo
            echo "- Environment: stage"
            echo "- Target environment branch: ${DEPLOY_BRANCH}"
            echo "- Selected workflow ref: ${WORKFLOW_REF}"
            echo "- Source commit SHA: ${SOURCE_SHA}"
            echo "- Cross-branch deploy: ${IS_CROSS_BRANCH_DEPLOY}"
            echo "- Version: ${{ needs.prepare.outputs.package_version }}"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack Notification - Success
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && success()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":white_check_mark: Image publish succeeded for ${{ needs.prepare.outputs.module }} in stage"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":white_check_mark: *Image publish succeeded*\n\n*Repository:* ${{ github.repository }}\n*Environment:* stage\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.prepare.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.prepare.outputs.package_version }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"

      - name: Slack Notification - Failure
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && failure()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "<!channel> :x: Image publish failed for ${{ needs.prepare.outputs.module }} in stage"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!channel> :x: *Image publish failed*\n\n*Repository:* ${{ github.repository }}\n*Environment:* stage\n*Module:* ${{ needs.prepare.outputs.module }}\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.prepare.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.prepare.outputs.package_version }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check workflow logs>"

  publish-prod:
    name: Publish image to Prod ECR
    runs-on: ubuntu-latest
    needs:
      - prepare
      - preview-prod
      - approval-prod-image-publish
    if: needs.prepare.outputs.deploy_branch == 'prod'
    environment: prod

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preview-prod.outputs.source_sha }}
          fetch-depth: 1

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          docker system prune -af
          docker volume prune -f

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Validate Prod AWS configuration
        id: prod-aws-config
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
          AWS_ACCOUNT_ID_STAGE: ${{ secrets.AWS_ACCOUNT_ID_STAGE }}
          AWS_ROLE_NAME_STAGE: ${{ vars.AWS_ROLE_NAME_STAGE }}
          DEPLOY_MODE: ${{ needs.preview-prod.outputs.deploy_mode }}
        run: |
          echo "aws_account_id=${AWS_ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
          echo "aws_role_name=${AWS_ROLE_NAME}" >> "$GITHUB_OUTPUT"

          if [ -z "${AWS_ACCOUNT_ID}" ]; then
            echo "Missing prod AWS account configuration. Expected secrets.AWS_ACCOUNT_ID."
            exit 1
          fi

          if [ -z "${AWS_ROLE_NAME}" ]; then
            echo "Missing prod AWS role configuration. Expected vars.AWS_ROLE_NAME."
            exit 1
          fi

          if [ "${DEPLOY_MODE}" = "stage_promotion" ] && [ -z "${AWS_ACCOUNT_ID_STAGE}" ]; then
            echo "Missing prod environment secret AWS_ACCOUNT_ID_STAGE for stage-to-prod promotion."
            exit 1
          fi

          if [ "${DEPLOY_MODE}" = "stage_promotion" ] && [ -z "${AWS_ROLE_NAME_STAGE}" ]; then
            echo "Missing prod environment variable AWS_ROLE_NAME_STAGE for stage-to-prod promotion."
            exit 1
          fi

      - name: Configure AWS Credentials for Stage (pull source image)
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGE }}:role/${{ vars.AWS_ROLE_NAME_STAGE }}
          role-session-name: publish_module_${{ needs.prepare.outputs.module }}_${{ secrets.AWS_ACCOUNT_ID_STAGE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Stage ECR
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Verify Stage image exists for promotion
        id: verify-stage-image
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        env:
          STAGE_SOURCE_TAG: ${{ needs.preview-prod.outputs.stage_source_tag }}
          EXPECTED_STAGE_SOURCE_DIGEST: ${{ needs.preview-prod.outputs.stage_source_digest }}
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ needs.prepare.outputs.module }}" \
            --image-ids imageTag="${STAGE_SOURCE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [ -z "${IMAGE_DIGEST}" ] || [ "${IMAGE_DIGEST}" = "None" ]; then
            echo "::error::Unable to verify Stage image tag ${STAGE_SOURCE_TAG} in ECR."
            exit 1
          fi

          if [ -z "${EXPECTED_STAGE_SOURCE_DIGEST}" ]; then
            echo "::error::Preview did not capture a Stage source digest for ${STAGE_SOURCE_TAG}."
            exit 1
          fi

          if [ "${IMAGE_DIGEST}" != "${EXPECTED_STAGE_SOURCE_DIGEST}" ]; then
            echo "::error::Stage image tag ${STAGE_SOURCE_TAG} changed after preview. Expected ${EXPECTED_STAGE_SOURCE_DIGEST}, found ${IMAGE_DIGEST}."
            exit 1
          fi

          echo "source_image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Verified Stage image tag ${STAGE_SOURCE_TAG} remains pinned to digest ${IMAGE_DIGEST}"

      - name: Configure AWS Credentials for Prod (promotion)
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.prod-aws-config.outputs.aws_account_id }}:role/${{ steps.prod-aws-config.outputs.aws_role_name }}
          role-session-name: publish_module_${{ needs.prepare.outputs.module }}_${{ steps.prod-aws-config.outputs.aws_account_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Prod ECR
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Promote image from Stage to Prod
        if: needs.preview-prod.outputs.deploy_mode == 'stage_promotion'
        env:
          STAGE_ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID_STAGE }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          PROD_ECR_REGISTRY: ${{ steps.prod-aws-config.outputs.aws_account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          PROD_TARGET_TAG: ${{ needs.preview-prod.outputs.prod_target_tag }}
          SOURCE_IMAGE_DIGEST: ${{ steps.verify-stage-image.outputs.source_image_digest }}
        run: |
          docker buildx imagetools create \
            --tag ${{ env.PROD_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}:${{ env.PROD_TARGET_TAG }} \
            --tag ${{ env.PROD_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}:latest \
            ${{ env.STAGE_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}@${{ env.SOURCE_IMAGE_DIGEST }}

      - name: Configure AWS Credentials for Prod (hotfix build)
        if: needs.preview-prod.outputs.deploy_mode == 'hotfix_build'
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::${{ steps.prod-aws-config.outputs.aws_account_id }}:role/${{ steps.prod-aws-config.outputs.aws_role_name }}
          role-session-name: publish_module_${{ needs.prepare.outputs.module }}_${{ steps.prod-aws-config.outputs.aws_account_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Prod ECR (hotfix build)
        if: needs.preview-prod.outputs.deploy_mode == 'hotfix_build'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build and push image to Prod (hotfix)
        if: needs.preview-prod.outputs.deploy_mode == 'hotfix_build'
        uses: docker/build-push-action@v7.1.0
        env:
          TARGET_ECR_REGISTRY: ${{ steps.prod-aws-config.outputs.aws_account_id }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          PROD_TARGET_TAG: ${{ needs.preview-prod.outputs.prod_target_tag }}
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.TARGET_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}:${{ env.PROD_TARGET_TAG }}
            ${{ env.TARGET_ECR_REGISTRY }}/${{ needs.prepare.outputs.module }}:latest

      - name: Slack Notification - Success
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && success()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":white_check_mark: Image publish succeeded for ${{ needs.prepare.outputs.module }} in prod"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ":white_check_mark: *Image publish succeeded*\n\n*Repository:* ${{ github.repository }}\n*Environment:* prod\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.preview-prod.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.preview-prod.outputs.package_version }}\n*Mode:* ${{ needs.preview-prod.outputs.deploy_mode == 'hotfix_build' && 'Hotfix build from source' || 'Promotion from stage image' }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"

      - name: Slack Notification - Failure
        if: env.SLACK_NOTIFICATIONS_ENABLED == 'true' && failure()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "<!channel> :x: Image publish failed for ${{ needs.prepare.outputs.module }} in prod"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "<!channel> :x: *Image publish failed*\n\n*Repository:* ${{ github.repository }}\n*Environment:* prod\n*Module:* ${{ needs.prepare.outputs.module }}\n*Target environment branch:* ${{ needs.prepare.outputs.deploy_branch }}\n*Selected workflow ref:* ${{ needs.prepare.outputs.workflow_ref }}\n*Source commit SHA:* ${{ needs.preview-prod.outputs.source_sha }}\n*Cross-branch deploy:* ${{ needs.prepare.outputs.is_cross_branch_deploy }}\n*Version:* ${{ needs.preview-prod.outputs.package_version }}\n*Mode:* ${{ needs.preview-prod.outputs.deploy_mode == 'hotfix_build' && 'Hotfix build from source' || 'Promotion from stage image' }}\n*Triggered by:* ${{ github.actor }}\n\n:point_right: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check workflow logs>"
