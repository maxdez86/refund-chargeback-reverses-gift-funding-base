kind = "web"
previewPath = "/"
title = "Brimax — Casamento Brida e Max"
version = "1.0.0"
id = "artifacts/brimax"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21328

[services.development]
run = "pnpm --filter @workspace/brimax run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brimax", "run", "build" ]
publicDir = "artifacts/brimax/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21328"
BASE_PATH = "/"
